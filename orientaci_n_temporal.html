<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tablero de Orientación Temporal y Estimulación Cognitiva</title>
    <!-- Tailwind CSS for modern responsive utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for clean, large visual icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font 'Fredoka' and 'Inter' for high legibility -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@600;800&display=swap" rel="stylesheet">

    <style>
        /* Base Accessibility and Blackboard Aesthetics */
        body {
            font-family: 'Fredoka', 'Inter', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            background-color: #1a2e22;
        }

        /* Chalkboard Texture and Borders */
        .chalkboard {
            background: radial-gradient(circle, #2d4a36 0%, #172b1d 100%);
            border: 14px solid #8B4513;
            border-radius: 20px;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8), 0 10px 25px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* Chalk Text Effect */
        .chalk-text {
            color: #ffffff;
            text-shadow: 0 0 3px rgba(255, 255, 255, 0.7), 2px 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 1px;
        }

        .chalk-title {
            color: #ffeb3b;
            text-shadow: 0 0 4px rgba(255, 235, 59, 0.6), 2px 2px 4px rgba(0,0,0,0.9);
        }

        /* High-Contrast Interactive Keypad Buttons */
        .num-btn {
            background-color: #FFFFFF !important;
            color: #D32F2F !important;
            border: 4px solid #B71C1C;
            box-shadow: 0 8px 0 #8E0000, 0 10px 15px rgba(0,0,0,0.4);
            transition: all 0.1s ease;
        }

        .num-btn:active, .num-btn.pressed {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #8E0000, 0 4px 6px rgba(0,0,0,0.4);
        }

        /* Slot Box Styling for Date Representation */
        .date-slot {
            background-color: rgba(0, 0, 0, 0.45);
            border: 4px stroke #ffffff;
            border-style: dashed;
            border-color: #a3e635;
            transition: all 0.2s ease;
        }

        .date-slot.filled {
            background-color: #ffffff;
            color: #111827;
            border-style: solid;
            border-color: #facc15;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .date-slot.active {
            animation: pulse-border 1.5s infinite;
        }

        @keyframes pulse-border {
            0% { border-color: #facc15; }
            50% { border-color: #ffffff; }
            100% { border-color: #facc15; }
        }

        /* Custom Utility Button Shadow */
        .action-btn-delete {
            background-color: #f97316;
            border: 4px solid #c2410c;
            box-shadow: 0 6px 0 #9a3412;
        }
        .action-btn-delete:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #9a3412;
        }

        .action-btn-check {
            background-color: #22c55e;
            border: 4px solid #15803d;
            box-shadow: 0 6px 0 #166534;
        }
        .action-btn-check:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #166534;
        }

        /* Touch Target Optimization */
        .touch-target {
            min-width: 68px;
            min-height: 68px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-2 sm:p-4 text-white">

    <!-- APP CONTAINER -->
    <div class="max-w-4xl w-full mx-auto flex-1 flex flex-col justify-center">

        <!-- ==================== PANTALLA 1: INICIO / BIENVENIDA ==================== -->
        <div id="screen-welcome" class="bg-emerald-900/90 border-8 border-amber-800 rounded-3xl p-6 md:p-10 text-center shadow-2xl backdrop-blur flex flex-col items-center">
            
            <h1 class="text-3xl sm:text-5xl font-extrabold text-yellow-300 mb-4 tracking-wide leading-tight drop-shadow-md">
                <i class="fa-solid fa-calendar-day mr-3"></i>El parte
            </h1>

            <p class="text-xl sm:text-2xl text-emerald-100 font-semibold mb-6 max-w-2xl">
                ¡Bienvenido/a al tablero de actividades diarias!
            </p>

            <!-- Imagen Cálida, Evocadora y Alegre para la Tercera Edad -->
            <div class="relative w-full max-w-md h-56 sm:h-72 rounded-2xl overflow-hidden border-4 border-amber-600 shadow-lg mb-8">
                <img src="https://images.unsplash.com/photo-1516627145497-ae6968895b74?auto=format&fit=crop&w=800&q=80" 
                     alt="Personas ancianas sonriendo alegremente y compartiendo momentos positivos" 
                     class="w-full h-full object-cover"
                     onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1581579438747-1dc8d1e0736f?auto=format&fit=crop&w=800&q=80';">
                <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent flex items-end justify-center p-4">
                    <span class="text-yellow-300 text-xl sm:text-3xl font-black text-center drop-shadow-lg tracking-wide uppercase">
                        "Todos los días aprendemos"
                    </span>
                </div>
            </div>

            <!-- Botón Grande de Alto Contraste para Iniciar -->
            <button id="btn-start" onclick="startGame()" 
                    class="touch-target w-full sm:w-auto px-10 py-5 bg-yellow-400 hover:bg-yellow-300 text-gray-900 text-2xl sm:text-3xl font-black rounded-2xl border-4 border-yellow-600 shadow-xl transform transition active:scale-95 flex items-center justify-center gap-4">
                <i class="fa-solid fa-play text-3xl"></i>
                <span>COMENZAR ACTIVIDAD</span>
            </button>
        </div>


        <!-- ==================== PANTALLA 2: ACTIVIDAD PIZARRA ==================== -->
        <div id="screen-activity" class="hidden chalkboard p-4 sm:p-8 flex flex-col justify-between min-h-[85vh]">
            
            <!-- Encabezado de Pizarra -->
            <div class="flex justify-between items-center border-b-2 border-emerald-600/50 pb-3 mb-4">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-graduation-cap text-yellow-400 text-2xl sm:text-4xl"></i>
                    <h2 class="text-xl sm:text-3xl font-bold chalk-title">¿Qué fecha es hoy?</h2>
                </div>
                <button onclick="resetActivity()" class="bg-emerald-800 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl border-2 border-emerald-500 font-bold text-sm sm:text-base flex items-center gap-2">
                    <i class="fa-solid fa-house"></i>
                    <span class="hidden sm:inline">Inicio</span>
                </button>
            </div>

            <!-- Zona Superior: Casilleros de la Fecha (DD / MM / AAAA) -->
            <div class="my-auto py-4">
                <p class="text-center text-lg sm:text-2xl chalk-text mb-4 font-bold">
                    Selecciona los números en orden para completar la fecha:
                </p>

                <!-- Slots de Fecha con Separadores Visuales Claro -->
                <div class="flex flex-wrap items-center justify-center gap-1 sm:gap-3 my-2">
                    
                    <!-- DÍA (DD) -->
                    <div class="flex gap-1 sm:gap-2 bg-emerald-950/60 p-2 sm:p-3 rounded-2xl border-2 border-emerald-500/50">
                        <div id="slot-0" class="date-slot touch-target w-11 h-16 sm:w-16 sm:h-24 rounded-xl flex items-center justify-center text-3xl sm:text-5xl font-black active"></div>
                        <div id="slot-1" class="date-slot touch-target w-11 h-16 sm:w-16 sm:h-24 rounded-xl flex items-center justify-center text-3xl sm:text-5xl font-black"></div>
                    </div>

                    <span class="text-4xl sm:text-6xl font-black text-yellow-400 mx-1">/</span>

                    <!-- MES (MM) -->
                    <div class="flex gap-1 sm:gap-2 bg-emerald-950/60 p-2 sm:p-3 rounded-2xl border-2 border-emerald-500/50">
                        <div id="slot-2" class="date-slot touch-target w-11 h-16 sm:w-16 sm:h-24 rounded-xl flex items-center justify-center text-3xl sm:text-5xl font-black"></div>
                        <div id="slot-3" class="date-slot touch-target w-11 h-16 sm:w-16 sm:h-24 rounded-xl flex items-center justify-center text-3xl sm:text-5xl font-black"></div>
                    </div>

                    <span class="text-4xl sm:text-6xl font-black text-yellow-400 mx-1">/</span>

                    <!-- AÑO (AAAA) -->
                    <div class="flex gap-1 sm:gap-2 bg-emerald-950/60 p-2 sm:p-3 rounded-2xl border-2 border-emerald-500/50">
                        <div id="slot-4" class="date-slot touch-target w-11 h-16 sm:w-16 sm:h-24 rounded-xl flex items-center justify-center text-3xl sm:text-5xl font-black"></div>
                        <div id="slot-5" class="date-slot touch-target w-11 h-16 sm:w-16 sm:h-24 rounded-xl flex items-center justify-center text-3xl sm:text-5xl font-black"></div>
                        <div id="slot-6" class="date-slot touch-target w-11 h-16 sm:w-16 sm:h-24 rounded-xl flex items-center justify-center text-3xl sm:text-5xl font-black"></div>
                        <div id="slot-7" class="date-slot touch-target w-11 h-16 sm:w-16 sm:h-24 rounded-xl flex items-center justify-center text-3xl sm:text-5xl font-black"></div>
                    </div>

                </div>

                <!-- Leyenda de formato -->
                <div class="flex justify-center gap-8 text-xs sm:text-base chalk-text opacity-90 mt-2 font-bold tracking-widest text-yellow-200">
                    <span>DÍA</span>
                    <span class="ml-4">MES</span>
                    <span class="ml-8">AÑO</span>
                </div>
            </div>

            <!-- Zona Inferior: Banco de Números e Interacción Táctil/Teclado -->
            <div class="bg-black/40 p-3 sm:p-5 rounded-2xl border-2 border-emerald-600/40 mt-auto">
                
                <!-- Botones Numéricos (0 - 9) Infinitos (Rojo sobre Blanco) -->
                <div class="grid grid-cols-5 sm:grid-cols-10 gap-2 sm:gap-3 mb-4">
                    <button onclick="pressNum('1')" class="num-btn touch-target h-14 sm:h-20 rounded-2xl text-3xl sm:text-4xl font-black flex items-center justify-center">1</button>
                    <button onclick="pressNum('2')" class="num-btn touch-target h-14 sm:h-20 rounded-2xl text-3xl sm:text-4xl font-black flex items-center justify-center">2</button>
                    <button onclick="pressNum('3')" class="num-btn touch-target h-14 sm:h-20 rounded-2xl text-3xl sm:text-4xl font-black flex items-center justify-center">3</button>
                    <button onclick="pressNum('4')" class="num-btn touch-target h-14 sm:h-20 rounded-2xl text-3xl sm:text-4xl font-black flex items-center justify-center">4</button>
                    <button onclick="pressNum('5')" class="num-btn touch-target h-14 sm:h-20 rounded-2xl text-3xl sm:text-4xl font-black flex items-center justify-center">5</button>
                    <button onclick="pressNum('6')" class="num-btn touch-target h-14 sm:h-20 rounded-2xl text-3xl sm:text-4xl font-black flex items-center justify-center">6</button>
                    <button onclick="pressNum('7')" class="num-btn touch-target h-14 sm:h-20 rounded-2xl text-3xl sm:text-4xl font-black flex items-center justify-center">7</button>
                    <button onclick="pressNum('8')" class="num-btn touch-target h-14 sm:h-20 rounded-2xl text-3xl sm:text-4xl font-black flex items-center justify-center">8</button>
                    <button onclick="pressNum('9')" class="num-btn touch-target h-14 sm:h-20 rounded-2xl text-3xl sm:text-4xl font-black flex items-center justify-center">9</button>
                    <button onclick="pressNum('0')" class="num-btn touch-target h-14 sm:h-20 rounded-2xl text-3xl sm:text-4xl font-black flex items-center justify-center">0</button>
                </div>

                <!-- Botones de Acción (Borrar y Validar) -->
                <div class="flex gap-3 justify-center">
                    <button onclick="deleteLastNum()" 
                            class="action-btn-delete touch-target flex-1 max-w-xs py-3 sm:py-4 rounded-2xl text-white text-lg sm:text-2xl font-black flex items-center justify-center gap-2">
                        <i class="fa-solid fa-delete-left text-2xl"></i>
                        <span>BORRAR</span>
                    </button>

                    <button onclick="clearAll()" 
                            class="bg-gray-700 hover:bg-gray-600 border-4 border-gray-900 py-3 sm:py-4 px-4 rounded-2xl text-white text-base sm:text-xl font-bold flex items-center justify-center">
                        <i class="fa-solid fa-rotate-left mr-1"></i> Reiniciar
                    </button>
                </div>

            </div>
        </div>

        <!-- ==================== PANTALLA MODAL DE FEEDBACK ==================== -->
        <div id="feedback-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div id="modal-content" class="max-w-md w-full rounded-3xl p-6 sm:p-8 text-center border-8 shadow-2xl flex flex-col items-center transform transition-all">
                
                <!-- Icono Dinámico -->
                <div id="modal-icon-container" class="w-24 h-24 rounded-full flex items-center justify-center text-5xl mb-4 shadow-inner">
                    <!-- Inyectado por JS -->
                </div>

                <!-- Título -->
                <h3 id="modal-title" class="text-3xl sm:text-4xl font-black mb-3">
                    <!-- Inyectado por JS -->
                </h3>

                <!-- Mensaje motivador -->
                <p id="modal-message" class="text-xl sm:text-2xl font-semibold mb-6 leading-relaxed">
                    <!-- Inyectado por JS -->
                </p>

                <!-- Botón Acción Modal -->
                <button id="modal-btn" onclick="closeModal()" 
                        class="touch-target w-full py-4 px-6 rounded-2xl text-2xl font-black shadow-lg border-4 transition transform active:scale-95">
                    Continuar
                </button>
            </div>
        </div>

    </div>

    <!-- PIE DE PÁGINA ADAPTADO -->
    <footer class="text-center text-xs sm:text-sm text-emerald-200/80 py-2">
        Herramienta Educativa e Interactiva para la Orientación Temporal • Accesibilidad WAP / Web
    </footer>

    <!-- JAVASCRIPT LOGIC & AUDIO SYNTHESIS -->
    <script>
        // ESTADO GLOBAL DE LA APLICACIÓN
        let selectedNumbers = [];
        const TOTAL_SLOTS = 8; // DDMMYYYY
        let targetDateStr = ""; // Formato DDMMYYYY real
        let formattedRealDateStr = ""; // Formato DD/MM/AAAA para feedback

        // Inicialización al cargar la página
        window.onload = function() {
            initTargetDate();
            setupKeyboardInput();
        };

        // Calcula la fecha actual en tiempo real mediante JavaScript
        function initTargetDate() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = String(now.getFullYear());

            targetDateStr = `${day}${month}${year}`;
            formattedRealDateStr = `${day}/${month}/${year}`;
            console.log("Fecha Objetivo Calculada:", formattedRealDateStr);
        }

        // Cambiar a la pantalla de la pizarra
        function startGame() {
            document.getElementById('screen-welcome').classList.add('hidden');
            document.getElementById('screen-activity').classList.remove('hidden');
            playSound(523.25, 'sine', 0.15); // C5
        }

        // Volver a inicio
        function resetActivity() {
            clearAll();
            document.getElementById('screen-activity').classList.add('hidden');
            document.getElementById('screen-welcome').classList.remove('hidden');
        }

        // Agregar número seleccionado al banco
        function pressNum(num) {
            if (selectedNumbers.length < TOTAL_SLOTS) {
                selectedNumbers.push(num);
                updateUI();
                playSound(400 + (selectedNumbers.length * 40), 'sine', 0.1);

                // Si se completan los 8 dígitos, validar automáticamente
                if (selectedNumbers.length === TOTAL_SLOTS) {
                    setTimeout(validateDate, 300);
                }
            }
        }

        // Borrar el último número ingresado
        function deleteLastNum() {
            if (selectedNumbers.length > 0) {
                selectedNumbers.pop();
                updateUI();
                playSound(300, 'square', 0.08);
            }
        }

        // Reiniciar los casilleros
        function clearAll() {
            selectedNumbers = [];
            updateUI();
            playSound(250, 'sine', 0.12);
        }

        // Actualizar la interfaz visual de las casillas en la pizarra
        function updateUI() {
            for (let i = 0; i < TOTAL_SLOTS; i++) {
                const slot = document.getElementById(`slot-${i}`);
                if (i < selectedNumbers.length) {
                    slot.innerText = selectedNumbers[i];
                    slot.classList.add('filled');
                    slot.classList.remove('active');
                } else {
                    slot.innerText = '';
                    slot.classList.remove('filled');
                    if (i === selectedNumbers.length) {
                        slot.classList.add('active'); // Destaca la casilla actual a rellenar
                    } else {
                        slot.classList.remove('active');
                    }
                }
            }
        }

        // Validar si la fecha elegida coincide con la fecha real del día
        function validateDate() {
            const userDateStr = selectedNumbers.join('');

            if (userDateStr === targetDateStr) {
                // ACERTADO: Mostrar pantalla de felicitación
                showFeedback(
                    true,
                    "¡Excelente Trabajo!",
                    `¡Has acertado! Hoy es <strong>${formattedRealDateStr}</strong>. ¡Muy bien orientado!`
                );
                playSuccessSound();
            } else {
                // INCORRECTO: Mostrar mensaje estimulante
                showFeedback(
                    false,
                    "Casi, inténtalo de nuevo",
                    `La fecha ingresada no coincide con el día de hoy. ¡Revisa los números e inténtalo otra vez!`
                );
                playErrorSound();
            }
        }

        // Muestra el Modal de Feedback con alto contraste
        function showFeedback(isSuccess, title, message) {
            const modal = document.getElementById('feedback-modal');
            const modalContent = document.getElementById('modal-content');
            const iconContainer = document.getElementById('modal-icon-container');
            const titleEl = document.getElementById('modal-title');
            const msgEl = document.getElementById('modal-message');
            const btnEl = document.getElementById('modal-btn');

            if (isSuccess) {
                modalContent.className = "max-w-md w-full rounded-3xl p-6 sm:p-8 text-center border-8 border-green-500 bg-emerald-900 text-white shadow-2xl flex flex-col items-center";
                iconContainer.className = "w-24 h-24 rounded-full bg-green-500 text-white flex items-center justify-center text-5xl mb-4 shadow-lg";
                iconContainer.innerHTML = '<i class="fa-solid fa-trophy"></i>';
                titleEl.className = "text-3xl sm:text-4xl font-black mb-3 text-yellow-300";
                btnEl.className = "touch-target w-full py-4 px-6 rounded-2xl text-2xl font-black bg-yellow-400 hover:bg-yellow-300 text-gray-900 border-4 border-yellow-600 shadow-lg";
                btnEl.innerText = "¡CONTINUAR!";
            } else {
                modalContent.className = "max-w-md w-full rounded-3xl p-6 sm:p-8 text-center border-8 border-amber-500 bg-stone-900 text-white shadow-2xl flex flex-col items-center";
                iconContainer.className = "w-24 h-24 rounded-full bg-amber-500 text-white flex items-center justify-center text-5xl mb-4 shadow-lg";
                iconContainer.innerHTML = '<i class="fa-solid fa-rotate-right"></i>';
                titleEl.className = "text-3xl sm:text-4xl font-black mb-3 text-amber-400";
                btnEl.className = "touch-target w-full py-4 px-6 rounded-2xl text-2xl font-black bg-amber-500 hover:bg-amber-400 text-gray-950 border-4 border-amber-700 shadow-lg";
                btnEl.innerText = "VOLVER A INTENTAR";
            }

            titleEl.innerText = title;
            msgEl.innerHTML = message;
            modal.classList.remove('hidden');
        }

        // Cierra el Modal
        function closeModal() {
            document.getElementById('feedback-modal').classList.add('hidden');
            if (selectedNumbers.length === TOTAL_SLOTS && selectedNumbers.join('') !== targetDateStr) {
                clearAll(); // Limpia para facilitar un nuevo intento
            }
        }

        // Soporte de Teclado Físico para PC/Web
        function setupKeyboardInput() {
            document.addEventListener('keydown', (e) => {
                const activityVisible = !document.getElementById('screen-activity').classList.contains('hidden');
                const modalVisible = !document.getElementById('feedback-modal').classList.contains('hidden');

                if (modalVisible) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        closeModal();
                    }
                    return;
                }

                if (activityVisible) {
                    if (e.key >= '0' && e.key <= '9') {
                        pressNum(e.key);
                    } else if (e.key === 'Backspace') {
                        deleteLastNum();
                    } else if (e.key === 'Escape') {
                        clearAll();
                    }
                }
            });
        }

        // Sintetizador de audio simple con Web Audio API (Sin archivos externos)
        function playSound(freq, type = 'sine', duration = 0.1) {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {
                // Silencioso si el navegador restringe el audio sin interacción previa
            }
        }

        function playSuccessSound() {
            playSound(523.25, 'triangle', 0.15); // C5
            setTimeout(() => playSound(659.25, 'triangle', 0.15), 150); // E5
            setTimeout(() => playSound(783.99, 'triangle', 0.3), 300);  // G5
        }

        function playErrorSound() {
            playSound(300, 'sawtooth', 0.2);
            setTimeout(() => playSound(220, 'sawtooth', 0.3), 200);
        }
    </script>
</body>
</html>
